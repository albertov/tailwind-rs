
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/d/d5/Tailwind_CSS_Logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography tests</title>
</head>
<body>
<!-- https://tailwindcss.com/docs/font-family -->
<div style="" class="font-sans"></div>
<div style="" class="font-serif"></div>
<div style="" class="font-mono"></div>
<!-- https://tailwindcss.com/docs/transition-duration -->
<div style="transition-duration:150ms;"></div>
<div style="transition-duration:0ms;"></div>
<div style="transition-duration:0ms;"></div>
<div style="transition-duration:100ms;"></div>
<div style="transition-duration:100ms;"></div>
<div style="transition-duration:unset;"></div>
<div style="transition-duration:unset;"></div>
<!-- https://tailwindcss.com/docs/transition-delay -->
<div style="transition-delay:100ms;"></div>
<div style="transition-delay:0ms;"></div>
<div style="transition-delay:0ms;"></div>
<div style="transition-delay:100ms;"></div>
<div style="transition-delay:100ms;"></div>
<div style="transition-delay:unset;"></div>
<div style="transition-delay:unset;"></div>
<!-- Testing problematic transition classes from react_ssr -->
<!-- https://tailwindcss.com/docs/transition-property -->
<div style="transition-property:none;"></div>
<div style="transition-duration:150ms;transition-property:all;transition-timing-function:cubic-bezier(0.4, 0, 0.2, 1);"></div>
<div style="transition-duration:150ms;transition-property:color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;transition-timing-function:cubic-bezier(0.4, 0, 0.2, 1);"></div>
<div style="transition-duration:150ms;transition-property:color, background-color, border-color, text-decoration-color, fill, stroke;transition-timing-function:cubic-bezier(0.4, 0, 0.2, 1);"></div>
<div style="transition-duration:150ms;transition-property:opacity;transition-timing-function:cubic-bezier(0.4, 0, 0.2, 1);"></div>
<div style="transition-duration:150ms;transition-property:box-shadow;transition-timing-function:cubic-bezier(0.4, 0, 0.2, 1);"></div>
<div style="transition-duration:150ms;transition-property:transform;transition-timing-function:cubic-bezier(0.4, 0, 0.2, 1);"></div>
<!-- https://tailwindcss.com/docs/animation -->
<div style="animation:none;"></div>
<div style="animation:spin 1s linear infinite;"></div>
<div style="animation:ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;"></div>
<div style="animation:pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
<div style="animation:bounce 1s infinite;"></div>
<!-- Animation with variants -->
<div style="animation:spin 1s linear infinite;"></div>
<div style="animation:pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
<div style="animation:bounce 1s infinite;"></div>
<div style="animation:ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;"></div>
<!-- Arbitrary animation -->
<div style="animation:wiggle 1s ease-in-out infinite;"></div>
</body>
</html>
