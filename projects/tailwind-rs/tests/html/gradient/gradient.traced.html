
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/d/d5/Tailwind_CSS_Logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient tests</title>
</head>
<body>
<!-- https://tailwindcss.com/docs/background-image#linear-gradients -->
<div class="bg-gradient-to-t"></div>
<div class="bg-gradient-to-tr"></div>
<div class="bg-gradient-to-r"></div>
<div class="bg-gradient-to-br"></div>
<div class="bg-gradient-to-b"></div>
<div class="bg-gradient-to-bl"></div>
<div class="bg-gradient-to-l"></div>
<div class="bg-gradient-to-tl"></div>
<!-- Gradient color stops -->
<div class="from-blue-500"></div>
<div class="via-purple-500"></div>
<div class="to-pink-500"></div>
<!-- Combined gradient -->
<div class="bg-gradient-to-r from-cyan-500 to-blue-500"></div>
</body>
</html>
