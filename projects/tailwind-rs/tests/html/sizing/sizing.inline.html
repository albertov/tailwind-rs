
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/d/d5/Tailwind_CSS_Logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sizing tests</title>
</head>
<body>
<!-- https://tailwindcss.com/docs/width -->
<div style="width:0px;"></div>
<div style="width:0px;"></div>
<div style="width:0.125rem;"></div>
<div style="width:0.25rem;"></div>
<div style="width:0.25rem;"></div>
<div style="width:1px;"></div>
<div style="width:auto;"></div>
<div style="" class="w-unset"></div>
<!-- https://tailwindcss.com/docs/width#percentage-widths -->
<div style="width:100%;"></div>
<div style="width:50%;"></div>
<div style="width:100%;"></div>
<div style="width:0%;"></div>
<div style="width:100%;"></div>
<div style="width:100%;"></div>
<!--https://tailwindcss.com/docs/width#viewport-width-->
<div style="width:100vw;"></div>
<div style="width:auto;"></div>
<div style="width:min-content;"></div>
<div style="width:max-content;"></div>
<div style="width:fit-content;"></div>
<div style="" class="w-unset"></div>
<!-- https://tailwindcss.com/docs/width#arbitrary-values -->
<div style="width:1px;"></div>
<div style="width:10%;"></div>
<!-- https://tailwindcss.com/docs/min-width -->
<div style="min-width:0px;"></div>
<div style="min-width:100%;"></div>
<div style="min-width:min-content;"></div>
<div style="min-width:max-content;"></div>
<div style="min-width:fit-content;"></div>
<div style="" class="min-w-unset"></div>
<!-- https://tailwindcss.com/docs/max-width -->
<div style="max-width:0px;"></div>
<div style="" class="max-w-none"></div>
<div style="max-width:20rem;"></div>
<div style="max-width:24rem;"></div>
<div style="max-width:28rem;"></div>
<div style="max-width:32rem;"></div>
<div style="max-width:36rem;"></div>
<div style="max-width:42rem;"></div>
<div style="max-width:48rem;"></div>
<div style="max-width:56rem;"></div>
<div style="max-width:64rem;"></div>
<div style="max-width:72rem;"></div>
<div style="max-width:80rem;"></div>
<div style="" class="max-w-screen-sm"></div>
<div style="max-width:50%;"></div>
<!-- https://tailwindcss.com/docs/margin#add-margin-to-a-single-side -->
<div style="height:100vh;"></div>
<div style="min-height:100vh;"></div>
<div style="max-height:100vh;"></div>
<!-- Size utilities (sets both width and height) -->
<div style="height:0px;width:0px;"></div>
<div style="height:1px;width:1px;"></div>
<div style="height:0.125rem;width:0.125rem;"></div>
<div style="height:0.25rem;width:0.25rem;"></div>
<div style="height:0.5rem;width:0.5rem;"></div>
<div style="height:1rem;width:1rem;"></div>
<div style="height:2rem;width:2rem;"></div>
<div style="height:4rem;width:4rem;"></div>
<div style="height:8rem;width:8rem;"></div>
<div style="height:16rem;width:16rem;"></div>
<div style="height:24rem;width:24rem;"></div>
<div style="height:min-content;width:min-content;"></div>
<div style="height:max-content;width:max-content;"></div>
<div style="height:fit-content;width:fit-content;"></div>
<div style="height:auto;width:auto;"></div>
<div style="height:100%;width:100%;"></div>
<div style="height:100vh;width:100vw;"></div>
<div style="height:50%;width:50%;"></div>
<div style="height:100px;width:100px;"></div>
<!-- Content sizing utilities for width/height -->
<div style="height:min-content;"></div>
<div style="height:max-content;"></div>
<div style="height:fit-content;"></div>
<div style="min-height:min-content;"></div>
<div style="min-height:max-content;"></div>
<div style="min-height:fit-content;"></div>
<div style="max-height:min-content;"></div>
<div style="max-height:max-content;"></div>
<div style="max-height:fit-content;"></div>
</body>
</html>
